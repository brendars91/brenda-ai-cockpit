# Prometheus Configuration for Gem Trinity Genesis
# Location: ops/monitoring/prometheus/prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'gem-trinity-genesis'
    environment: 'local'

# Alerting configuration (optional for personal use)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files (optional alert rules)
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API metrics
  - job_name: 'gem-backend'
    scrape_interval: 30s
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'backend'
          component: 'api'

  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'system'

  # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    scrape_interval: 30s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'containers'

  # n8n metrics (if available)
  - job_name: 'n8n'
    scrape_interval: 30s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5678']
        labels:
          service: 'automation'
