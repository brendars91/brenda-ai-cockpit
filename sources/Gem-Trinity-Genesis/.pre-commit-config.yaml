# Pre-commit hooks configuration for Gem Trinity Genesis
# Run: pip install pre-commit && pre-commit install

repos:
  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.12
        args: [--line-length=100]

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.0
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  # Python security linter
  - repo: https://github.com/pycqa/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        files: ^local-watcher/

  # TypeScript/JavaScript formatting
  - repo: https://github.com/prettier/prettier
    rev: 3.2.4
    hooks:
      - id: prettier
        types_or: [ts, tsx, js, jsx, json, yaml, markdown]
        exclude: ^(frontend/node_modules|frontend/.next|frontend/package-lock.json)

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: ^.ssh/

  # TypeScript type checking (frontend only)
  - repo: local
    hooks:
      - id: tsc-frontend
        name: TypeScript type check (frontend)
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        files: ^(frontend/.*\.(ts|tsx))$
        pass_filenames: false
