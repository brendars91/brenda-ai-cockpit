[package]
name = "cockpit-app"
version = "0.0.1"
description = "Cockpit Unificado Multi-Agente"
authors = ["Brenda"]
edition = "2021"

[lib]
name = "cockpit_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
